name: xregrid-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.14
  - esmpy
  - xesmf
  - xarray
  - cf-xarray
  - pyproj
  - numpy
  - scipy
  - dask
  - cubed
  - cubed-xarray
  - zarr>=3.1.2
  - netcdf4
  - pandas
  - matplotlib
  - cartopy
  - pooch
  - pytest
  - hypothesis
  - pip
  - pip:
    - -e .
